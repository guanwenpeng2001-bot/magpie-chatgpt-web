<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Local native model announcement fixture</title>
<!-- Behavioral fixture for the observed effort-only header and Chinese slider
     announcement. Model rows stay attached/inert in the slider's own menu. -->
<form><div id="prompt-textarea" contenteditable="true">Unsent fixture draft</div>
  <button type="button" aria-haspopup="menu" aria-controls="picker" aria-expanded="true"
    data-composer-navigation-target="reasoning" data-selected-reasoning-effort="high">High</button></form>
<div id="picker" role="menu" aria-label="选择 ChatGPT 模型">
  <div data-model-picker-view="simple">
    <div data-active="true" aria-hidden="false">
      <div role="menuitem" data-model-picker-view-toggle="true" tabindex="0">
        <div data-menu-row-content><span id="header-effort">High</span><svg></svg></div>
      </div>
      <span id="status" role="status" aria-live="polite">High，第 3 项，共 5 项。</span>
      <span id="hint">使用左右方向键调整强度</span>
      <div role="menuitem" aria-describedby="status hint" tabindex="-1">
        <div data-model-picker-power-slider style="height:30px;width:250px">
          <span data-orientation="horizontal" aria-disabled="false">
            <span data-selected="true"></span><span data-selected="true"></span><span data-selected="true"></span>
            <span data-selected="false"></span><span data-selected="false"></span>
            <span role="slider" aria-hidden="true" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2"></span>
          </span>
        </div>
      </div>
    </div>
    <div id="model-rows" data-active="false" aria-hidden="true" inert>
      <div role="menuitemradio" aria-checked="true" data-model-selected="true" tabindex="-1"><div data-menu-row-content><span>GPT-6</span></div></div>
      <div role="menuitemradio" aria-checked="false" tabindex="-1"><div data-menu-row-content><span>GPT-5.6 Sol</span></div></div>
    </div>
  </div>
</div>
</html>
